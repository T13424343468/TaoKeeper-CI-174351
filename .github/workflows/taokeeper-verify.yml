# TaoKeeper CI verification (2026-11-12, boss-approved early GH Actions use)
# Scope: device-pending 6 items coverable by CI. UI navigation remains device-only.
# Boundary: no edits to existing code; CI-only scripts under ci/ and .github/.
name: taokeeper-verify

on:
  push:
    branches: [ main ]
    tags: [ 'v1.0.0-rc1' ]
  workflow_dispatch:

jobs:
  cpp-ctest:
    name: C++ 5 suites (cmake+MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Clean stale build dirs (pitfall 9)
        run: if (Test-Path native/TaoKeeperScan/build) { Remove-Item -Recurse -Force native/TaoKeeperScan/build }
        shell: pwsh
      - name: Configure
        run: cmake -S native/TaoKeeperScan -B native/TaoKeeperScan/build -G "Visual Studio 17 2022" -A x64
        shell: pwsh
      - name: Build (zero-error gate)
        run: |
          cmake --build native/TaoKeeperScan/build --config Release 2>&1 | Tee-Object -FilePath cpp-build.log
          $errs = (Select-String -Path cpp-build.log -Pattern ': error ' | Measure-Object).Count
          Write-Host "[CHECK] cpp build error count: $errs"
          if ($errs -ne 0) { exit 1 }
        shell: pwsh
      - name: Test (5 suites)
        run: ctest --test-dir native/TaoKeeperScan/build -C Release --output-on-failure
        shell: pwsh

  dotnet-tests:
    name: .NET 3 test projects + shell build + build.ps1
    runs-on: windows-latest
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Test Core+AppKernel+Adapters
        run: |
          dotnet test tests/TaoKeeper.Core.Tests -c Release
          dotnet test tests/TaoKeeper.AppKernel.Tests -c Release
          dotnet test tests/TaoKeeper.Adapters.Tests -c Release
        shell: pwsh
      - name: Build WinUI shell (uncomment SDK ref first, pitfall 17)
        run: |
          ci/uncomment-winappsdk.ps1 -CsprojPath src/TaoKeeper.App/TaoKeeper.App.csproj
          # 修红三定谳：XamlCompiler.exe 间歇性硬崩（同码同机红后绿，G0 对照实证），MSB3073 无 XLS 即重试
          $attempt = 0
          while ($true) {
            $attempt++
            Remove-Item Env:\MSBUILDDISABLENODEREUSE -ErrorAction SilentlyContinue
            $env:MSBUILDDISABLENODEREUSE = '1'
            dotnet build src/TaoKeeper.App/TaoKeeper.App.csproj -c Release -p:Platform=x64 -p:NodeReuse=false 2>&1 | Tee-Object -FilePath winui-build.log
            $exit = $LASTEXITCODE
            $errs = (Select-String -Path winui-build.log -Pattern ': error ' | Measure-Object).Count
            $xls = (Select-String -Path winui-build.log -Pattern 'XLS\d+' | Measure-Object).Count
            $warns = (Select-String -Path winui-build.log -Pattern ': warning ' | Measure-Object).Count
            if ($exit -eq 0) { break }
            if ($attempt -ge 3 -or $xls -gt 0) { break }
            if ($errs -gt 0 -and (Select-String -Path winui-build.log -Pattern 'MSB3073' | Measure-Object).Count -ge $errs) {
              Write-Host "[XAML-RETRY] attempt $attempt crashed with MSB3073 only (known intermittent XamlCompiler crash) - killing nodes and retrying"
              taskkill /F /IM MSBuild.exe 2>$null; taskkill /F /IM dotnet.exe 2>$null
              Remove-Item -Recurse -Force src/TaoKeeper.App/obj/x64 -ErrorAction SilentlyContinue
              continue
            }
            break
          }
          Write-Host "[CHECK] winui attempts=$attempt error count: $errs, warning count: $warns"
          # 修红三取证：XamlCompiler 真实错误在 output.json，必须打上 stdout，不许再猜
          pwsh -NoProfile -File ci/xaml-compiler-evidence.ps1 -ProjDir src/TaoKeeper.App -Configuration Release -Platform x64
          ci/restore-winappsdk.ps1 -CsprojPath src/TaoKeeper.App/TaoKeeper.App.csproj
          if ($exit -ne 0) { exit 1 }
          if ($warns -gt 0) { Write-Host "[WARN-GATE] $warns warnings present - reporting, not suppressing" }
      - name: build.ps1 real run (pwsh 7.4+)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1 -SkipNative
        shell: pwsh
      - name: Data effect probe (seed known tree, assert exact scan/dup/junk numbers)
        run: dotnet run --project ci/EffectProbe -c Release
        shell: pwsh

  admin-capability-probe:
    name: Admin capability probe (elevated ops on cloud runner)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe elevated token, defrag and schtasks round-trip
        run: |
          $integrity = (whoami /groups) -match 'S-1-16-12288' -or (whoami /groups) -match 'High Mandatory'
          Write-Host "[ADMIN-PROBE] high-integrity token present: $integrity"
          $isAdmin = ((whoami /groups) -match 'S-1-5-32-544') -ne $null
          Write-Host "[ADMIN-PROBE] Administrators group member: $isAdmin"
          defrag /? 2>&1 | Select-Object -First 2 | ForEach-Object { Write-Host "[ADMIN-PROBE] defrag: $_" }
          try {
            schtasks /create /tn "TKAdminProbe" /tr "cmd /c exit" /sc once /st 23:59 /f 2>&1 | ForEach-Object { Write-Host "[ADMIN-PROBE] schtasks create: $_" }
            schtasks /query /tn "TKAdminProbe" 2>&1 | Select-String "TKAdminProbe" | ForEach-Object { Write-Host "[ADMIN-PROBE] schtasks query: $_" }
            schtasks /delete /tn "TKAdminProbe" /f 2>&1 | ForEach-Object { Write-Host "[ADMIN-PROBE] schtasks delete: $_" }
            Write-Host "[ADMIN-PROBE] schtasks round-trip OK"
          } catch { Write-Host "[ADMIN-PROBE] schtasks FAILED: $_" }
          try {
            $list = defrag C: /A 2>&1 | Select-Object -First 12
            $list | ForEach-Object { Write-Host "[ADMIN-PROBE] defrag C: /A: $_" }
            Write-Host "[ADMIN-PROBE] defrag analyze OK"
          } catch { Write-Host "[ADMIN-PROBE] defrag analyze FAILED: $_" }
        shell: pwsh
  display-dual-res-shots:
    name: Display diff surfaces (1424x714 window + 200% DPI, cloud capture)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Publish UI payload
        run: |
          ci/uncomment-winappsdk.ps1 -CsprojPath src/TaoKeeper.App/TaoKeeper.App.csproj
          dotnet publish src/TaoKeeper.App -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -o tools/msi/publish-dualres
          if (-not (Test-Path tools/msi/publish-dualres/TaoKeeper.App.exe)) { Write-Host "[ERROR] dual-res payload missing"; exit 1 }
        shell: pwsh
      - name: Capture all 12 nav pages at 1424x714 and 200% DPI
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/display-dual-res-shots.ps1 -ExePath (Resolve-Path tools/msi/publish-dualres/TaoKeeper.App.exe) -OutDir dual-res-shots
        shell: pwsh
      - name: Upload dual-res screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-res-shots
          path: dual-res-shots/

  msi-fullflow:
    name: MSI bind, install, uninstall, upgrade, hashes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish payload offline
        run: |
          ci/uncomment-winappsdk.ps1 -CsprojPath src/TaoKeeper.App/TaoKeeper.App.csproj
          dotnet publish src/TaoKeeper.App -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:Platform=x64 -o tools/msi/publish
          if (-not (Test-Path tools/msi/publish/TaoKeeper.App.exe)) { Write-Host "[ERROR] payload exe missing"; exit 1 }
          Write-Host "[OK] publish payload ready"
        shell: pwsh
      - name: Install WiX 5.0.2 + UI extension
        run: |
          dotnet tool install -g wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
        shell: pwsh
      - name: Build MSI (single-msi gate)
        run: |
          cmd /c "tools\msi\build-msi.bat" 2>&1 | Tee-Object -FilePath msi-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content msi-build.log -Tail 40; exit $LASTEXITCODE }
          if (-not (Test-Path tools/msi/out/TaoKeeper-PC-MSI-v1.0.0.msi)) { Write-Host "[ERROR] msi missing"; exit 1 }
        shell: pwsh
      - name: Silent install, uninstall, upgrade path
        run: |
          $msi = "tools\msi\out\TaoKeeper-PC-MSI-v1.0.0.msi"
          $p1 = Start-Process msiexec -ArgumentList "/i",$msi,"/qn","/norestart","/l*v","install.log" -Wait -PassThru
          Write-Host "[INSTALL] exit=$($p1.ExitCode)"
          if ($p1.ExitCode -ne 0) { Get-Content install.log -Tail 40; exit 1 }
          $arp = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*TaoKeeper*" }
          Write-Host "[CHECK] ARP entry: $($arp.DisplayName) version $($arp.DisplayVersion)"
          $desk=[Environment]::GetFolderPath('CommonDesktopDirectory')
          if (-not (Test-Path "$desk\TaoKeeper.lnk")) { Write-Host "[ERROR] desktop shortcut missing"; Get-ChildItem "$desk" -Filter "*.lnk" | Select-Object -First 20 -ExpandProperty Name; exit 1 }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\TaoKeeper.lnk")) { Write-Host "[ERROR] start-menu shortcut missing"; exit 1 }
          Write-Host "[OK] desktop + start-menu shortcuts present after install"
          if (-not $arp) { Write-Host "[ERROR] no ARP entry after install"; Get-Content install.log -Tail 40; exit 1 }
          $p2 = Start-Process msiexec -ArgumentList "/x",$($arp.PSChildName),"/qn","/norestart","/l*v","uninstall.log" -Wait -PassThru
          Write-Host "[UNINSTALL] exit=$($p2.ExitCode)"
          if ($p2.ExitCode -ne 0) { Get-Content uninstall.log -Tail 40; exit 1 }
          $arp2 = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*TaoKeeper*" }
          if ($arp2) { Write-Host "[ERROR] ARP residue after uninstall"; exit 1 }
          Write-Host "[OK] uninstall clean"
          $p3 = Start-Process msiexec -ArgumentList "/i",$msi,"/qn","/norestart","/l*v","upgrade.log" -Wait -PassThru
          Write-Host "[UPGRADE-REINSTALL] exit=$($p3.ExitCode)"
          if ($p3.ExitCode -ne 0) { Get-Content upgrade.log -Tail 40; exit 1 }
          $arp3 = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*TaoKeeper*" }
          Write-Host "[OK] msi full flow: install, uninstall, reinstall(upgrade) all green"
        shell: pwsh
      - name: Launch app + live-fire UI walk (all pages, real actions, assertions)
        run: |
          dotnet publish src/TaoKeeper.App -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -o tools/msi/publish-ui
          if (-not (Test-Path tools/msi/publish-ui/TaoKeeper.App.exe)) { Write-Host "[ERROR] ui payload missing"; exit 1 }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/live-fire-walk.ps1 -ExePath (Resolve-Path tools/msi/publish-ui/TaoKeeper.App.exe) -OutDir ci-shots
      - name: Effect probe D-1/D-4 (seed real junk -> product scan -> confirm clean -> recycle-bin restore -> ledger match)
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/effect-probe-d1d4.ps1 -ExePath (Resolve-Path tools/msi/publish-ui/TaoKeeper.App.exe) -OutDir effect-shots
        shell: pwsh
      - name: Effect probe D-2 (page-file plan - honest display + no-silent-change red line + executor wiring gate)
        if: always()
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/effect-probe-d2-pagefile.ps1 -ExePath (Resolve-Path tools/msi/publish-ui/TaoKeeper.App.exe) -OutDir effect-shots-d2
        shell: pwsh
      - name: Effect probe D-3 (checkup - seeded junk reported with basis -> real clean via disk page -> re-check clean)
        if: always()
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/effect-probe-d3-checkup.ps1 -ExePath (Resolve-Path tools/msi/publish-ui/TaoKeeper.App.exe) -OutDir effect-shots-d3
        shell: pwsh
      - name: Effect probe D-5 (startup item - real listing -> disable attempt -> registry verify -> rollback gate)
        if: always()
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/effect-probe-d5-startup.ps1 -ExePath (Resolve-Path tools/msi/publish-ui/TaoKeeper.App.exe) -OutDir effect-shots-d5
        shell: pwsh
      - name: Live-fire winget end-to-end (real install -> verify -> uninstall -> verify gone)
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/winget-livefire.ps1 -OutDir winget-shots
        shell: pwsh
      - name: Soak stability 30min (attach/launch + real disk scan + full metrics)
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/soak-stability.ps1 -MsiPath tools/msi/out/TaoKeeper-PC-MSI-v1.0.0.msi -OutDir soak-shots
        shell: pwsh
      - name: Cleanup (uninstall after visual pass)
        run: |
          $arp = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*TaoKeeper*" }
          if ($arp) { Start-Process msiexec -ArgumentList "/x",$arp.PSChildName,"/qn","/norestart" -Wait; Write-Host "[OK] cleanup uninstall done" }
        shell: pwsh
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            ci-shots/
            effect-shots/
            effect-shots-d2/
            effect-shots-d3/
            effect-shots-d5/
            winget-shots/
      - name: Upload soak metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-metrics
          path: soak-shots/
      - name: Hash triple (bytes + SHA-256 + manifest)
        run: |
          ci/make-hashes-ci.ps1 -OutDir tools/msi/out
          $msi = Get-Item tools/msi/out/TaoKeeper-PC-MSI-v1.0.0.msi
          Write-Host "[HASH] bytes=$($msi.Length) sha256=$((Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower())"
        shell: pwsh
      - name: Upload final MSI (delivery retrieval; bind needs Windows msi.dll, sandbox cannot produce)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-msi
          path: tools/msi/out/
